# Beta smoke test on the supported platforms (Ubuntu and macOS). It checks install.sh and the Claude Code plugin's
# hooks through the plugin's own wrapper. No API call is made: the live probe runs a zero-spend stub agent, and
# every key in this workflow is a fake in the accepted shape. There are no secrets.
name: beta-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true

      - name: Build trove and the zero-spend stub agent
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # Build with the plugin's pinned version, as a release build does. The wrapper accepts a trove on PATH
          # only when `trove version` prints exactly that version (VERSION "dev" accepts any).
          ver="$(tr -d ' \r\n' < plugin/trove/VERSION)"
          go build -ldflags "-X github.com/usetrove/trove/internal/cli.Version=$ver" -o "$RUNNER_TEMP/bin/trove" ./cmd/trove
          go build -o "$RUNNER_TEMP/bin/stubagent" ./qa/stubagent
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: install.sh refuses a tampered or missing checksum and installs a good one
        run: sh install_test.sh

      - name: Plugin hooks run through the wrapper, with the stub agent (no model call)
        env:
          TROVE_DATA_DIR: ${{ runner.temp }}/trove-data
          HOME: ${{ runner.temp }}/home
          USERPROFILE: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          sh scripts/plugin-smoke.sh "$RUNNER_TEMP/bin/stubagent"
