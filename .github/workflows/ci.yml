name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          # Build the linter with the runner's Go. Prebuilt binaries lag the newest
          # stable Go and fail with "export data version ... greater than maximum".
          install-mode: goinstall

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # -race needs cgo for the test binary only; the shipped binary is built with CGO_ENABLED=0.
      # -short skips the latency budgets (5 ms gateway, 20 ms hooks): the race detector slows code
      # several times over, so a budget measured under it says nothing about the shipped binary.
      - run: go test -race -short ./...
      # The same suite without the race detector, including the latency budgets and smoke tests.
      - run: go test -count=1 ./...
      # Launch drafts may hold unresolved slots, but never a bare figure or a slot with a missing source.
      - run: go run ./scripts/checkclaims

  # Privacy gates (CLAUDE.md rules 1, 2 and 7). These also run inside `test`; this
  # job exists so they are named in the checks list and cannot be skipped: it
  # installs strace and fails, rather than skips, if the harness cannot run.
  privacy:
    runs-on: ubuntu-latest
    env:
      TROVE_REQUIRE_STRACE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y strace
      - name: No outbound network except the configured upstream (static allowlist + strace)
        run: go test -count=1 -v ./internal/egress
      - name: No credential or prompt text in logs, responses or on disk
        run: go test -count=1 -v -run 'TestNoCredentialOrPromptReachesLogsResponsesOrDisk|TestNonAPIKeyAuthIsRejected' ./internal/gateway
      - name: Redaction, metadata-only schema, retention of every table, data inventory matches the schema
        run: go test -count=1 ./internal/redact ./internal/store ./internal/hooks ./internal/logs/... ./internal/features ./internal/tuning ./internal/recommend
      - name: Canary strings never reach the database, the data folder or anything shared
        run: go test -count=1 -v ./internal/privacy
      - name: Opt-in sharing is off by default; only `contribute delete` ever sends a delete; setup needs an API key; data export and delete
        run: go test -count=1 -run 'Contribute|TestData|Uninstall|Purge|TestSetup|TestNothingBut' ./internal/cli ./internal/contribute
      - name: No Claude, Anthropic, Codex or OpenAI in our own names (rule 13)
        run: go test -count=1 ./internal/naming

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: node --test "npm/test/*.test.js"

  # The OpenCode plugin: strict typecheck, then its tests against a real `trove engine serve`
  # built from this checkout. Serial: each test file builds or starts the program.
  opencode-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build trove for the plugin tests
        run: go build -o "$RUNNER_TEMP/trove" ./cmd/trove
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0 # the tests run TypeScript directly and use node:sqlite
      - run: npm ci
        working-directory: plugins/opencode
      - run: npx tsc --noEmit
        working-directory: plugins/opencode
      - run: npm test
        working-directory: plugins/opencode
        env:
          TROVE_BIN: ${{ runner.temp }}/trove

  # The optional summary receiver (server/worker). It also reads a Go golden file, so
  # a payload change that its validator would reject fails here.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: node --test
        working-directory: server/worker

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # Offline tests only: no Docker, no network, no API calls.
      - run: pip install -e "bench[dev,report]"
      - run: pytest bench/tests

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: shellcheck install.sh plugin/trove/bin/trove
      - run: sh install_test.sh

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  build:
    needs: [lint, test]
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o trove-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/trove
