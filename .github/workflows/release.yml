name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
      # The Claude Code plugin reads its version from plugin/trove/VERSION. A release must pin it to the tag;
      # "dev" means a source checkout, and the plugin would then accept any trove on PATH. Fail before publishing.
      - name: Check the plugin version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(tr -d ' \r\n' < plugin/trove/VERSION)"
          if [ "$got" != "$want" ]; then
            echo "plugin/trove/VERSION is '$got' but the tag is '$want'. Set VERSION to $want, commit it, then tag again." >&2
            exit 1
          fi
          manifest="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' plugin/trove/.claude-plugin/plugin.json)"
          if [ "$manifest" != "$want" ]; then
            echo "plugin/trove/.claude-plugin/plugin.json version is '$manifest' but the tag is '$want'. Set it to $want, commit it, then tag again." >&2
            exit 1
          fi
      # Warn (never fail) when any bundled price was last verified over 30 days ago.
      - name: Check pricing freshness
        run: go run ./scripts/pricingage
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        id: syft
      - name: Put syft on PATH
        run: dirname "${{ steps.syft.outputs.cmd }}" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token with write access to usetrove/homebrew-trove (the default token cannot push to another repo).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
