name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # keyless cosign signing and build provenance via GitHub OIDC
  attestations: write # SLSA build provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
      # The Claude Code plugin reads its version from plugin/trove/VERSION. A release must pin it to the tag;
      # "dev" means a source checkout, and the plugin would then accept any trove on PATH. Fail before publishing.
      - name: Check the plugin version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(tr -d ' \r\n' < plugin/trove/VERSION)"
          if [ "$got" != "$want" ]; then
            echo "plugin/trove/VERSION is '$got' but the tag is '$want'. Set VERSION to $want, commit it, then tag again." >&2
            exit 1
          fi
          manifest="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' plugin/trove/.claude-plugin/plugin.json)"
          if [ "$manifest" != "$want" ]; then
            echo "plugin/trove/.claude-plugin/plugin.json version is '$manifest' but the tag is '$want'. Set it to $want, commit it, then tag again." >&2
            exit 1
          fi
      # Warn (never fail) when any bundled price was last verified over 30 days ago.
      - name: Check pricing freshness
        run: go run ./scripts/pricingage
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: Put syft on PATH
        run: dirname "${{ steps.syft.outputs.cmd }}" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token with write access to usetrove/homebrew-trove (the default token cannot push to another repo).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # SLSA build provenance: a signed statement of which workflow, commit and runner built each archive.
      # Verify with: gh attestation verify <archive> --repo usetrove/trove
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Publishes @usetrove/trove, the npm package that downloads and verifies the release binary. It runs only after the
  # GitHub release (and its archives) exist, because the package fetches them on first run. It does nothing until an
  # NPM_TOKEN secret (an npm automation token for the usetrove scope) is added, so a release never fails for want of one.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip when no npm token is configured
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "NPM_TOKEN is not set, so @usetrove/trove was not published. See npm/PUBLISHING.md."
      - name: Test the package
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: node --test "npm/test/*.test.js"
      - name: Publish with provenance
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        working-directory: npm
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm version "$version" --no-git-tag-version
          # A pre-release tag such as v0.5.0-rc1 must not become what `npm install` gets by default.
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
