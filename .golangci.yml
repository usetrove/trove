version: "2"
linters:
  default: standard
  enable:
    - revive
    - bodyclose
    - gosec
  settings:
    staticcheck:
      checks:
        - all
        # Trove's error messages are full sentences that tell the user what to do next.
        - -ST1005
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # Error messages are full sentences that say what to do next.
      - linters: [revive]
        text: error-strings
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
