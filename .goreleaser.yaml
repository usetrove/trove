# GoReleaser v2. Dry run: goreleaser release --snapshot --clean --skip=sign
# (add ,sbom if syft is not installed locally).
version: 2
project_name: trove

builds:
  - id: trove
    main: ./cmd/trove
    binary: trove
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # A fixed file time (the commit time) and no build-time clock in the binary:
    # the same commit and Go toolchain give the same bytes. The Go version used is
    # recorded in each binary (`go version -m trove`) so a rebuild can match it.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/usetrove/trove/internal/cli.Version={{ .Version }}
      - -X github.com/usetrove/trove/internal/cli.Commit={{ .Commit }}
      - -X github.com/usetrove/trove/internal/cli.Date={{ .CommitDate }}

archives:
  - id: trove
    formats: [tar.gz]
    name_template: "trove_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Keyless cosign signature over checksums.txt (which covers every archive).
# Verify with:
#   cosign verify-blob \
#     --certificate-identity 'https://github.com/usetrove/trove/.github/workflows/release.yml@refs/tags/vX.Y.Z' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     --bundle checksums.txt.sigstore.json checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# One SPDX JSON SBOM per archive, generated by syft (GoReleaser's default).
sboms:
  - id: archive
    artifacts: archive

# Homebrew formula. `brews` is deprecated since GoReleaser v2.10 in favour of
# `homebrew_casks`, but casks are macOS-only, so we keep formulas for Linux users.
brews:
  - name: trove
    repository:
      owner: usetrove
      name: homebrew-trove
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # A tag such as v0.1.0-rc1 must not replace the formula people install from.
    skip_upload: auto
    homepage: https://github.com/usetrove/trove
    description: The efficiency layer for AI coding agents
    license: Apache-2.0
    test: |
      system "#{bin}/trove", "version"

release:
  github:
    owner: usetrove
    name: trove
  # A tag with a suffix such as -rc1 is published as a pre-release, so it is
  # never the "latest" release that install.sh and the release page point to.
  prerelease: auto

changelog:
  sort: asc
