# GoReleaser v2. Dry run: goreleaser release --snapshot --clean --skip=sign
# (add ,sbom if syft is not installed locally).
version: 2
project_name: trove

builds:
  - id: trove
    main: ./cmd/trove
    binary: trove
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jaclynsunardi/trove/internal/cli.Version={{ .Version }}
      - -X github.com/jaclynsunardi/trove/internal/cli.Commit={{ .Commit }}
      - -X github.com/jaclynsunardi/trove/internal/cli.Date={{ .Date }}

archives:
  - id: trove
    formats: [tar.gz]
    name_template: "trove_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Keyless cosign signature over checksums.txt (which covers every archive).
# Verify with:
#   cosign verify-blob \
#     --certificate-identity 'https://github.com/jaclynsunardi/trove/.github/workflows/release.yml@refs/tags/vX.Y.Z' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     --bundle checksums.txt.sigstore.json checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# One SPDX JSON SBOM per archive, generated by syft (GoReleaser's default).
sboms:
  - id: archive
    artifacts: archive

# Homebrew formula. `brews` is deprecated since GoReleaser v2.10 in favour of
# `homebrew_casks`, but casks are macOS-only, so we keep formulas for Linux users.
brews:
  - name: trove
    repository:
      owner: jaclynsunardi
      name: homebrew-trove
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jaclynsunardi/trove
    description: The efficiency layer for AI coding agents
    license: Apache-2.0
    test: |
      system "#{bin}/trove", "version"

release:
  github:
    owner: jaclynsunardi
    name: trove

changelog:
  sort: asc
