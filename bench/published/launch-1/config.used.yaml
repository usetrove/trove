# Launch study: what Trove saves on long Claude Code sessions on Sonnet.
#
# Run it with the scripts in bench/scripts/launch/ (see bench/scripts/launch/README.md). In short:
#   bash bench/scripts/launch/01_check.sh      free: tests and a fake end-to-end run
#   bash bench/scripts/launch/02_pilot.sh      ~$1-3: 2 tasks x 3 conditions, real cost per run
#   bash bench/scripts/launch/03_run.sh        the study, staged, hard-capped
#   bash bench/scripts/launch/04_report.sh     report, priors, publish folder, commit
#
# Conditions (Claude Code pinned in bench/config.yaml, API-key auth only, every condition behind a Trove gateway so
# that every run is priced the same way, from the provider-reported usage the gateway records for each request):
#   passthrough          no optimization: the gateway forwards every request unchanged and only records it
#   passthrough_plugin   the Trove plugin as a user installs it (hooks + Trove's MCP server); the gateway only records
#   trove_full           the plugin + every safe gateway optimizer + verbosity_steer (T2) + model_router (T3), which
#                        sends tool turns to route_to and keeps them there for the sticky-turn minimum
#
# Why every condition has a gateway: Claude Code prices a turn the gateway routed to the cheaper model as if it ran on
# the requested model (seen in a live run on 2026-11-18), so its own cost report cannot price trove_full. The gateway
# records the model that actually served each request, so `recorded` is the only basis that prices all three alike.
#
# Workload, fixed before any run: the long-session suite (plan item 10.5). Each task is a polyglot Python exercise plus
# three follow-up prompts in the same session (harden, refactor, review), the work Trove targets. Results hold for this
# kind of session; they say nothing about one-shot tasks. Generate the tasks with:
#   python -m trovebench fetch longsession -n 30 --seed 20261118 --commit 7e0611e77b54e2dea774cdc0aa00cf9f7ed6144f \
#       --out bench/tasks/longsession30
#
# Staged: the analysis runs after each repeat and the study stops once both comparisons are decided. Each look is
# tested at alpha / repeats = 0.0167, so stopping early never inflates the false-positive rate. Holm covers the two
# comparisons within a look.

id: launch-1
title: "Long Sonnet sessions: no optimization vs the Trove plugin vs the plugin + gateway + routing"
hypothesis: >
  On long Claude Code sessions with Sonnet, the Trove plugin alone lowers the billed cost per session, and the plugin
  with the gateway and model routing lowers it further, in both cases without lowering the share of tasks that pass.
primary_metric: billed_cost_usd
secondary_metrics: [success_rate, latency_s]
baseline_condition: passthrough
conditions: [passthrough, passthrough_plugin, trove_full]
tasks: tasks/longsession30
repeats: 3
staged: true
order_seed: 20261118
model: claude-sonnet-5-5
route_to: claude-haiku-5-5
cost_basis: recorded
analysis:
  alpha: 0.05
  bootstrap_resamples: 10000
  bootstrap_seed: 20261118
  multiple_comparison: holm
ship_rule:
  min_cost_reduction_pct: 5
  success_margin_pts: 5
  min_pairs: 30
budget:
  batch_cap_usd: 70.0
  run_cap_usd: 1.50
