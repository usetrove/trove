[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trovebench"
version = "0.1.0"
description = "Reproducible A/B harness: coding agents with and without Trove optimizations"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["trovebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
