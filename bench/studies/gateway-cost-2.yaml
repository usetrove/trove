# Study (b): does the optional gateway, with every safe optimizer on, lower the cost of real coding tasks
# under Claude Code, with API-key auth? Held-out tasks: a fresh draw of 30 polyglot exercises (seed 20261108),
# not the 10 used in the 2026-11-08 study.
#
# Register before running:   python -m trovebench prereg bench/studies/gateway-cost-2.yaml
# Plan (spends nothing):     python -m trovebench plan --study bench/studies/gateway-cost-2.yaml
# Run (spends real money):   python -m trovebench run  --study bench/studies/gateway-cost-2.yaml --yes

id: gateway-cost-2
title: "Gateway with all safe optimizers vs gateway with every optimizer off, on 30 held-out tasks"
hypothesis: >
  Turning on every safe gateway optimizer lowers the billed cost per task under Claude Code, without lowering
  the share of tasks that pass.
primary_metric: billed_cost_usd
secondary_metrics: [success_rate, latency_s]
baseline_condition: passthrough
conditions: [passthrough, all_safe]
tasks: tasks/polyglot30
repeats: 3
order_seed: 20261108
cost_basis: agent
analysis:
  alpha: 0.05
  bootstrap_resamples: 10000
  bootstrap_seed: 20261108
  multiple_comparison: holm
ship_rule:
  min_cost_reduction_pct: 5      # the cost-change interval must be entirely at or below -5%
  success_margin_pts: 5          # the success difference interval must stay above -5 points
  min_pairs: 30
budget:
  batch_cap_usd: 10.0
  run_cap_usd: 0.50
