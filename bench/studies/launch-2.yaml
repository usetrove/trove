# Launch study 2: what Trove saves over a long working session in Claude Code on Sonnet.
#
# Run it with the scripts in bench/scripts/launch/ (see bench/scripts/launch/README.md), passing this file:
#   STUDY=bench/studies/launch-2.yaml bash bench/scripts/launch/02_pilot.sh
#   STUDY=bench/studies/launch-2.yaml bash bench/scripts/launch/03_run.sh
#   STUDY=bench/studies/launch-2.yaml bash bench/scripts/launch/04_report.sh
#
# What changed from launch-1, and why (written before any launch-2 run; launch-1's report has the full correction):
#   * Same launch mode in every arm. launch-1's baseline ran Claude Code with --bare and the plugin arms could not,
#     so the plugin arms also paid for the full Claude Code setup. Now every arm runs without --bare, so the arms
#     differ only in Trove (versions.json records agent_launch_mode).
#   * Longer sessions. launch-1's sessions had a median of about 6 tool calls. The workday suite sends seven
#     ordinary follow-ups after the first implementation, none of which mentions anything Trove does.
#   * More tasks (40, not 30), so the total-cost interval is narrower for the same effect.
#   * The report shows the rule's total-cost figure next to the median, and the hooks' own trimming is counted.
# The conditions, the decision rule and the cost basis are the same as launch-1's.
#
# Conditions (Claude Code pinned in bench/config.yaml, API-key auth only, every condition behind a Trove gateway so
# that every run is priced the same way, from the provider-reported usage the gateway records for each request):
#   passthrough          no optimization: the gateway forwards every request unchanged and only records it
#   passthrough_plugin   the Trove plugin as a user installs it (hooks + Trove's MCP server); the gateway only records
#   trove_full           the plugin + every safe gateway optimizer + verbosity_steer (T2) + model_router (T3), which
#                        sends tool turns to route_to and keeps them there for the sticky-turn minimum
#
# Workload, fixed before any run: the workday suite. Generate the tasks with:
#   python -m trovebench fetch workday -n 40 --seed 20261119 --commit 7e0611e77b54e2dea774cdc0aa00cf9f7ed6144f \
#       --out bench/tasks/workday40
#
# Staged: the analysis runs after each repeat and the study stops once both comparisons are decided. Each look is
# tested at alpha / repeats = 0.0167, so stopping early never inflates the false-positive rate. Holm covers the two
# comparisons within a look.

id: launch-2
title: "Long working sessions on Sonnet: no optimization vs the Trove plugin vs the plugin + gateway + routing"
hypothesis: >
  Over a long Claude Code working session on Sonnet, with every arm launched the same way, the Trove plugin alone
  lowers the billed cost per session, and the plugin with the gateway and model routing lowers it further, in both
  cases without lowering the share of tasks that pass.
primary_metric: billed_cost_usd
secondary_metrics: [success_rate, latency_s]
baseline_condition: passthrough
conditions: [passthrough, passthrough_plugin, trove_full]
tasks: tasks/workday40
repeats: 3
staged: true
order_seed: 20261119
model: claude-sonnet-5-5
route_to: claude-haiku-5-5
cost_basis: recorded
analysis:
  alpha: 0.05
  bootstrap_resamples: 10000
  bootstrap_seed: 20261119
  multiple_comparison: holm
ship_rule:
  min_cost_reduction_pct: 5
  success_margin_pts: 5
  min_pairs: 30
budget:
  batch_cap_usd: 100.0
  run_cap_usd: 3.00
