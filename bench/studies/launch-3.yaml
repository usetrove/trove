# Launch study 3: launch-2's design on launch-1's task suite, sized to finish within a launch day.
#
# Run it with the scripts in bench/scripts/launch/ (they default to this study; see bench/scripts/launch/README.md):
#   bash bench/scripts/launch/02_pilot.sh
#   bash bench/scripts/launch/03_run.sh
#   bash bench/scripts/launch/04_report.sh
#
# Why this study exists (written 2026-11-18, before any launch-2 or launch-3 run): launch-2's workday sessions take an
# estimated 3-5 minutes each, so one look (120 sessions) takes 6-10 hours, which does not fit before launch. launch-3
# keeps everything launch-2 fixed from launch-1 and changes only the workload and the number of looks:
#   * Same launch mode in every arm (no --bare anywhere), which removes launch-1's confound (see the correction at the
#     end of bench/published/launch-1/report.md).
#   * The long-session suite launch-1 used (30 tasks, about 1-1.5 minutes each), so one look is 90 sessions, about 2 h.
#   * At most 2 looks, staged: each look is tested at alpha / 2 = 0.025, and the study stops once both comparisons are
#     decided, so stopping early never inflates the false-positive rate.
# The conditions, the decision rule and the cost basis are launch-2's. launch-2 stays registered for a later run.
#
# What to expect, stated before the run: launch-1's sessions had a median of about 8 tool calls, and Trove saves most
# on long sessions, so either comparison may read NEED MORE DATA. The claim covers this suite on Sonnet with the
# pinned Claude Code version only.
#
# Conditions (Claude Code pinned in bench/config.yaml, API-key auth only, every condition behind a Trove gateway so
# that every run is priced the same way, from the provider-reported usage the gateway records for each request):
#   passthrough          no optimization: the gateway forwards every request unchanged and only records it
#   passthrough_plugin   the Trove plugin as a user installs it (hooks + Trove's MCP server); the gateway only records
#   trove_full           the plugin + every safe gateway optimizer + verbosity_steer (T2) + model_router (T3), which
#                        sends tool turns to route_to and keeps them there for the sticky-turn minimum

id: launch-3
title: "Long sessions on Sonnet, every arm launched the same way: no optimization vs the Trove plugin vs the plugin + gateway + routing"
hypothesis: >
  On long Claude Code sessions with Sonnet, with every arm launched the same way, the Trove plugin alone lowers the
  billed cost per session, and the plugin with the gateway and model routing lowers it further, in both cases without
  lowering the share of tasks that pass.
primary_metric: billed_cost_usd
secondary_metrics: [success_rate, latency_s]
baseline_condition: passthrough
conditions: [passthrough, passthrough_plugin, trove_full]
tasks: tasks/longsession30
repeats: 2
staged: true
order_seed: 20261120
model: claude-sonnet-5-5
route_to: claude-haiku-5-5
cost_basis: recorded
analysis:
  alpha: 0.05
  bootstrap_resamples: 10000
  bootstrap_seed: 20261120
  multiple_comparison: holm
ship_rule:
  min_cost_reduction_pct: 5
  success_margin_pts: 5
  min_pairs: 30
budget:
  batch_cap_usd: 40.0
  run_cap_usd: 1.50
