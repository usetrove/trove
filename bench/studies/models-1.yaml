# Models and features study: Trove's model levers and installable features, each against no optimization, on
# one-shot Sonnet tasks. Plan items: 7.1 (the cascade, scout and settings-profile studies), the A/B of 7.2
# (model_router), and the model_default prior of 7.5 (`recommends` below).
#
# Run it after the launch study, with the same runbook (bench/scripts/launch/), passing STUDY=bench/studies/models-1.yaml
# and TASKS=bench/tasks/polyglot30 (see bench/scripts/launch/README.md, "Later studies").
#
# Conditions (all behind a gateway, so every run is priced from the gateway's records: Claude Code prices a turn the
# gateway routed to another model as the model it asked for):
#   passthrough        no optimization; the gateway only records
#   task_cascade       Trove's /trove-cascade: a cheap worker first, the strong model only when the task's tests fail
#   task_scout         Trove's scout subagent for exploration, on the cheaper model
#   alone_model_router tool turns stepped down to route_to, with the sticky-turn rule
#   default_model      the whole session on route_to: what a cheaper default model would do
#   profile_quick_fix  the quick-fix settings profile (outputStyle Concise), applied with --allow-unproven
#
# Tasks: polyglot30, one prompt each. Cascade and a cheaper default are levers for small, well-specified tasks, and
# the claim holds for that kind of task only. Generate them with:
#   python -m trovebench fetch polyglot -n 30 --seed 20261108 --out bench/tasks/polyglot30

id: models-1
title: "Cascade, scout, model routing, a cheaper default and a settings profile, against no optimization, on Sonnet"
hypothesis: >
  Each model lever or feature lowers the cost per task against no optimization on Sonnet, without lowering the share
  of tasks that pass.
primary_metric: billed_cost_usd
secondary_metrics: [success_rate, latency_s]
baseline_condition: passthrough
conditions: [passthrough, task_cascade, task_scout, alone_model_router, default_model, profile_quick_fix]
tasks: tasks/polyglot30
repeats: 2
staged: true
order_seed: 20261120
model: claude-sonnet-5-5
route_to: claude-haiku-5-5
cost_basis: recorded
analysis:
  alpha: 0.05
  bootstrap_resamples: 10000
  bootstrap_seed: 20261120
  multiple_comparison: holm
ship_rule:
  min_cost_reduction_pct: 5
  success_margin_pts: 5
  min_pairs: 30
budget:
  batch_cap_usd: 50.0
  run_cap_usd: 1.00
recommends:
  default_model: {rule_id: cheaper-default-model, kind: prior, name: model_default}
  alone_model_router:
    rule_id: route-tool-turns
    kind: optimizer
    name: model_router
    reason: "Over {sessions} sessions here, most turns only returned tool results on an expensive model. Model routing in shadow mode estimates what stepping those turns down would save, including the cache write each switch costs."
  profile_quick_fix: {rule_id: profile-quick-fix, kind: profile, name: quick-fix}
