id: smoke-add
source: smoke
repo: "local:repo"
base_commit: local
license: MIT
prompt: |
  The unit tests in test_calc.py fail. Find the bug in calc.py and fix it.
  Do not modify the tests. Run `python -m unittest` to check your work.
image: python:3.12-slim
setup: []
grading_setup:
  - git checkout HEAD -- test_calc.py
success_cmd: python -m unittest -q
timeout_s: 600
tags: [smoke, python]
