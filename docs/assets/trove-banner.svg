<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Trove</title>
  <desc id="desc">Trove: the efficiency layer for AI coding agents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="240" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="239" rx="23.5" fill="none" stroke="#1e293b"/>

  <!-- gem -->
  <g transform="translate(60 38)">
    <polygon points="30,22 90,22 105,57 45,57" fill="#99f6e4"/>
    <polygon points="30,22 45,57 0,57" fill="#5eead4"/>
    <polygon points="90,22 120,57 105,57" fill="#2dd4bf"/>
    <polygon points="0,57 45,57 60,137" fill="#0d9488"/>
    <polygon points="45,57 105,57 60,137" fill="#14b8a6"/>
    <polygon points="105,57 120,57 60,137" fill="#0f766e"/>
  </g>

  <!-- wordmark -->
  <text x="230" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-2" fill="#f8fafc">Trove</text>
  <rect x="232" y="146" width="96" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="232" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#94a3b8">The efficiency layer for AI coding agents</text>
</svg>
