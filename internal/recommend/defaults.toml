# GENERATED by `python -m trovebench defaults`. Do not edit by hand.
# Inputs: bench/defaults_seed.toml (rules of thumb, evidence = "none") plus these pre-registered result folders:
#   (none: no result met the ship rule, so every rule is still a rule of thumb)
# A rule is evidence = "benchmark" only when a study's pooled result cleared its registered ship rule and no effort level
# contradicted it. Rules the results contradict are removed. See docs/benchmark-methodology.md and docs/recommend.md.
# Rules only ever suggest the safe first step: an optimizer in shadow mode (estimate only, change nothing) or a settings profile.
# Reasons are templates. Placeholders: {sessions} {files_read} {repeat_reads} {large_results} {dup_ratio} {error_share}
# {compactions} {size} {framework} {task}. They are filled with numbers and fixed names only.
version = 1
release = "seed-1"
min_sessions = 3

[[rule]]
id = "trim-large-test-output"
kind = "optimizer"
name = "output_trimmer"
action = "shadow"
evidence = "none"
reason = "Over your last {sessions} sessions in this repo, tool results averaged {large_results} per session over 6,000 bytes. The output trimmer keeps failures and a summary and shortens the rest; in shadow mode it only estimates what it would remove."
[rule.when]
min_large_results = 3

[[rule]]
id = "block-repeat-reads"
kind = "optimizer"
name = "hook_repeat_read"
action = "shadow"
evidence = "none"
reason = "Sessions here re-read a file already read about {repeat_reads} times each (over {sessions} sessions). Repeat-read prevention in shadow mode counts how many reads it would have avoided."
[rule.when]
min_repeat_reads = 2

[[rule]]
id = "limit-big-reads"
kind = "optimizer"
name = "hook_read_limit"
action = "shadow"
evidence = "none"
reason = "This repo is in size bucket {size} and sessions read about {files_read} files each. Line limits on big reads in shadow mode estimate what they would save."
[rule.when]
size_in = ["L", "XL"]
min_files_read = 20

[[rule]]
id = "quiet-test-commands"
kind = "optimizer"
name = "hook_quiet_commands"
action = "shadow"
evidence = "none"
reason = "A {framework} test setup was detected and tool results here average {large_results} large outputs per session. Quiet flags on test commands in shadow mode estimate the saving."
[rule.when]
test_framework_in = ["go_test", "pytest", "jest", "vitest", "mocha", "cargo_test", "junit", "rspec"]
min_large_results = 1

[[rule]]
id = "hint-large-output"
kind = "optimizer"
name = "hook_large_output"
action = "shadow"
evidence = "none"
reason = "Tool results in this repo average {large_results} large outputs per session over {sessions} sessions, and a {framework} test setup was detected. The large-output hint suggests the trove_run tool for noisy commands; in shadow mode it only counts."
[rule.when]
test_framework_in = ["go_test", "pytest", "jest", "vitest", "mocha", "cargo_test", "junit", "rspec"]
min_large_results = 3

[[rule]]
id = "normalize-noisy-output"
kind = "optimizer"
name = "noise_normalizer"
action = "shadow"
evidence = "none"
reason = "About {dup_ratio} of non-blank lines in tool results here are repeated (over {sessions} sessions). The noise normalizer in shadow mode estimates what collapsing them would save."
[rule.when]
min_dup_ratio = 0.3
min_tool_results = 5

[[rule]]
id = "profile-quick-fix"
kind = "profile"
name = "quick-fix"
action = "use_profile"
evidence = "none"
reason = "You said the task is {task}. Trove has a settings profile for it (`trove settings`). It has no benchmark behind it yet, so values without evidence are left out unless you allow them."
[rule.when]
task_in = ["quick-fix"]

